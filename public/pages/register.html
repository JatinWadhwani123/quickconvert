<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P0J95EMTB3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-P0J95EMTB3");
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | QuickConvert</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/lucide.min.js"></script>
</head>

<body class="qc-auth-page">
  <main class="qc-auth-shell qc-auth-shell-reverse">
    <aside class="qc-auth-aside" aria-label="QuickConvert workspace">
      <div>
        <p class="qc-eyebrow">Start free</p>
        <h2>Create a workspace for faster file tasks.</h2>
        <div class="qc-auth-benefits">
          <span><i data-lucide="file-check"></i> Save account preferences</span>
          <span><i data-lucide="layout-dashboard"></i> Access your dashboard</span>
          <span><i data-lucide="users"></i> Invite team members</span>
        </div>
      </div>
    </aside>

    <section class="qc-auth-card" aria-labelledby="registerTitle">
      <a class="qc-auth-brand" href="/">
        <img src="/logo.png" alt="" width="34" height="34">
        <span>QuickConvert</span>
      </a>

      <div class="qc-auth-heading">
        <p class="qc-eyebrow">New account</p>
        <h1 id="registerTitle">Create your account</h1>
        <p>Join QuickConvert and start managing PDF and image tasks from one clean workspace.</p>
      </div>

      <div class="field qc-field">
        <input id="email" type="email" placeholder=" " autocomplete="email">
        <label>Email</label>
      </div>

      <div class="field qc-field">
        <input id="password" type="password" placeholder=" " autocomplete="new-password">
        <label>Password</label>
      </div>

      <button class="qc-auth-submit" type="button" onclick="register()">Create Account</button>
      <div id="status" class="status qc-status" role="status"></div>

      <p class="qc-auth-footer">Already have an account? <a href="/login">Login</a></p>
    </section>
  </main>

  <script>
    if (localStorage.getItem("token")) {
      window.location.href = "/dashboard";
    }

    async function register() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");

      status.textContent = "Creating account...";
      status.className = "status qc-status";

      if (!email || !password) {
        status.textContent = "Enter your email and password.";
        status.className = "status qc-status error";
        return;
      }

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.msg || data.message || "Registration failed");

        if (data.token) {
          localStorage.setItem("token", data.token);
        }

        status.textContent = "Account created. Redirecting...";
        status.className = "status qc-status success";

        setTimeout(() => {
          window.location.href = "/dashboard";
        }, 800);
      } catch (err) {
        status.textContent = err.message || "Registration failed";
        status.className = "status qc-status error";
      }
    }

    window.addEventListener("load", () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
