<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

body {
  display: flex;
  font-family: sans-serif;
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  height: 100vh;
  background: #f5f5f5;
  padding: 20px;
}

.sidebar h3 {
  margin-bottom: 20px;
}

.sidebar a {
  display: block;
  padding: 10px;
  margin: 5px 0;
  text-decoration: none;
  color: black;
  border-radius: 8px;
}

.sidebar a:hover {
  background: #ddd;
}

/* MAIN */
.main {
  flex: 1;
  padding: 40px;
}

/* CARD */
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <h3>My Account</h3>

  <a href="#">Profile</a>
  <a href="#">Security</a>
  <a href="#">Teams</a>

  <h3>Settings</h3>

  <a href="#">Tools</a>
  <a href="#">Workflows</a>

  <h3>Billing</h3>

  <a href="#">Plans</a>

</div>

<!-- MAIN -->
<div class="main">

  <h1>Profile</h1>

  <div class="card">
    <h3>User Info</h3>
    <p id="userEmail">Loading...</p>
  </div>

  <div class="card">
    <h3>Actions</h3>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<script>

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "/login";
}

// fake display
document.getElementById("userEmail").textContent = "Logged in ✔";

function logout() {
  localStorage.removeItem("token");
  window.location.href = "/";
}

</script>

<script>
lucide.createIcons();
</script>

</body>
</html>
