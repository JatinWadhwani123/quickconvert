<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* RESET */
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f3f4f6;
}

/* HEADER (FULL WIDTH) */
.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 25px;
  background: white;
  border-bottom: 1px solid #eee;
}

.logo {
  font-size: 20px;
  font-weight: 600;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}

.home-btn {
  background: #ff4d4f;
  color: white;
  padding: 8px 18px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
}

.home-btn:hover {
  background: #e63b3d;
}

.user-box {
  background: #f5f5f5;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 13px;
}

/* MAIN LAYOUT */
.dashboard-container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: white;
  padding: 20px;
  border-right: 1px solid #eee;
  min-height: calc(100vh - 60px);
}

.sidebar h3 {
  font-size: 13px;
  color: #888;
  margin-top: 20px;
}

.sidebar a {
  display: block;
  padding: 10px 12px;
  margin: 5px 0;
  text-decoration: none;
  color: #333;
  border-radius: 8px;
  font-size: 14px;
}

.sidebar a:hover {
  background: #f0f0f0;
}

.sidebar a.active {
  background: #ff4d4d;
  color: white;
}

/* CONTENT */
.main-content {
  flex: 1;
  padding: 30px;
}

/* CARDS */
.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

/* SECTION */
.section {
  display: none;
}

#profileSection {
  display: block;
}

/* BUTTON */
button {
  padding: 10px 20px;
  border: none;
  background: #ff4d4d;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #e63c3c;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="dashboard-header">
  <div class="logo">QuickConvert</div>

  <div class="header-actions">
    <a href="/" class="home-btn">Home</a>

    <div class="user-box">
      👤 <span id="userEmail2"></span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="dashboard-container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h3>My Account</h3>
    <a href="#" onclick="showSection('profile')" id="linkProfile" class="active">Profile</a>
    <a href="#" onclick="showSection('security')" id="linkSecurity">Security</a>
    <a href="#" onclick="showSection('teams')" id="linkTeams">Teams</a>

    <h3>Settings</h3>
    <a href="#" onclick="showSection('tools')" id="linkTools">Tools</a>
    <a href="#" onclick="showSection('workflows')" id="linkWorkflows">Workflows</a>

    <h3>Billing</h3>
    <a href="#" onclick="showSection('plans')" id="linkPlans">Plans</a>

  </div>

  <!-- CONTENT -->
  <div class="main-content">

    <h2>Dashboard</h2>

    <!-- PROFILE -->
    <div id="profileSection" class="section">

      <h1>Profile</h1>

      <div class="card">
        <h3>User Info</h3>

        <label>Full Name</label><br>
        <input type="text" id="userName" style="width:100%;padding:10px;margin:10px 0;"><br>

        <label>Email</label><br>
        <input type="text" id="userEmail" disabled style="width:100%;padding:10px;margin:10px 0;"><br>

        <button onclick="updateProfile()">Update Profile</button>

        <p id="updateMsg" style="color:green;margin-top:10px;"></p>
      </div>

    </div>

    <!-- SECURITY -->
    <div id="securitySection" class="section">
      <h1>Security</h1>
      <div class="card">
        <p>Password & 2FA settings</p>
      </div>
    </div>

    <!-- TEAMS -->
    <div id="teamsSection" class="section">
      <h1>Teams</h1>
      <div class="card">
        <button>Create Team</button>
      </div>
    </div>

    <!-- TOOLS -->
    <div id="toolsSection" class="section">
      <h1>Tools</h1>
      <div class="card">
        <p>Tool preferences</p>
      </div>
    </div>

    <!-- WORKFLOWS -->
    <div id="workflowsSection" class="section">
      <h1>Workflows</h1>
      <div class="card">
        <button>Create Workflow</button>
      </div>
    </div>

    <!-- PLANS -->
    <div id="plansSection" class="section">
      <h1>Plans</h1>
      <div class="card">
        <button>Upgrade</button>
      </div>
    </div>

    <!-- LOGOUT -->
    <div class="card">
      <button onclick="logout()">Logout</button>
    </div>

  </div>

</div>

<script>

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "/login";
}

async function loadUser() {
  try {
    const res = await fetch("/api/auth/me", {
      headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();
    if (!res.ok) throw new Error();

    document.getElementById("userEmail").value = data.email;
    document.getElementById("userEmail2").textContent = data.email;
    document.getElementById("userName").value = data.name || "";

  } catch {
    localStorage.removeItem("token");
    window.location.href = "/login";
  }
}
loadUser();

async function updateProfile() {
  const name = document.getElementById("userName").value;

  try {
    const res = await fetch("/api/auth/update", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ name })
    });

    if (!res.ok) throw new Error();

    document.getElementById("updateMsg").textContent =
      "Profile updated successfully ✅";

  } catch {
    alert("Update failed ❌");
  }
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "/";
}

function showSection(section) {
  document.querySelectorAll(".section").forEach(s => s.style.display = "none");
  document.querySelectorAll(".sidebar a").forEach(l => l.classList.remove("active"));

  document.getElementById(section + "Section").style.display = "block";
  document.getElementById("link" + capitalize(section)).classList.add("active");
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

lucide.createIcons();

</script>

</body>
</html>
