<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

body {
  display: flex;
  font-family: sans-serif;
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  height: 100vh;
  background: #f5f5f5;
  padding: 20px;
}

.sidebar h3 {
  margin-bottom: 20px;
}

.sidebar a {
  display: block;
  padding: 10px;
  margin: 5px 0;
  text-decoration: none;
  color: black;
  border-radius: 8px;
}

.sidebar a:hover {
  background: #ddd;
}

/* MAIN */
.main {
  flex: 1;
  padding: 40px;
}

/* CARD */
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

.sidebar a.active {
  background: #ff4d4d;
  color: white;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <h3>My Account</h3>

  <a href="#" onclick="showSection('profile')" id="linkProfile" class="active">Profile</a>
<a href="#" onclick="showSection('security')" id="linkSecurity">Security</a>
<a href="#" onclick="showSection('teams')" id="linkTeams">Teams</a>

  <h3>Settings</h3>

  <a href="#" onclick="showSection('tools')" id="linkTools">Tools</a>
<a href="#" onclick="showSection('workflows')" id="linkWorkflows">Workflows</a>

  <h3>Billing</h3>

<a href="#" onclick="showSection('plans')" id="linkPlans">Plans</a>

</div>

<!-- MAIN -->
<div class="main">

  <!-- PROFILE -->
  <div id="profileSection" class="section">
    <h1>Profile</h1>

    <div class="card">
      <h3>User Info</h3>
      <p id="userEmail">Loading...</p>
    </div>
  </div>

  <!-- SECURITY -->
  <div id="securitySection" class="section" style="display:none;">
    <h1>Security</h1>

    <div class="card">
      <h3>Password</h3>
      <p>Create or update your password</p>
    </div>
  </div>

  <!-- TEAMS -->
  <div id="teamsSection" class="section" style="display:none;">
    <h1>Teams</h1>

    <div class="card">
      <p>Create and manage teams</p>
    </div>
  </div>

  <!-- TOOLS -->
  <div id="toolsSection" class="section" style="display:none;">
    <h1>Tools Settings</h1>

    <div class="card">
      <p>Tool preferences here</p>
    </div>
  </div>

  <!-- WORKFLOWS -->
  <div id="workflowsSection" class="section" style="display:none;">
    <h1>Workflows</h1>

    <div class="card">
      <p>Create workflows</p>
    </div>
  </div>

  <!-- PLANS -->
  <div id="plansSection" class="section" style="display:none;">
    <h1>Plans</h1>

    <div class="card">
      <p>Upgrade to premium</p>
    </div>
  </div>

  <!-- LOGOUT -->
  <div class="card">
    <button onclick="logout()">Logout</button>
  </div>

</div>

<script>

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "/login";
}

// ✅ LOAD USER FROM BACKEND
async function loadUser() {

  try {

    const res = await fetch("/api/auth/me", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const data = await res.json();

    if (!res.ok) throw new Error();

    document.getElementById("userEmail").textContent = data.email;

  } catch (err) {

    localStorage.removeItem("token");
    window.location.href = "/login";

  }

}

loadUser();

function logout() {
  localStorage.removeItem("token");
  window.location.href = "/";
}

function showSection(section) {

  document.querySelectorAll(".section").forEach(s => {
    s.style.display = "none";
  });

  document.querySelectorAll(".sidebar a").forEach(link => {
    link.classList.remove("active");
  });

  document.getElementById(section + "Section").style.display = "block";
  document.getElementById("link" + capitalize(section)).classList.add("active");
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

lucide.createIcons();

</script>

</body>
</html>
