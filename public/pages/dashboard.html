<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f6f7fb;
}

/* HEADER */
.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.7);
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
}

.logo {
  font-size: 20px;
  font-weight: 600;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}

.home-btn {
  background: linear-gradient(135deg, #ff4d4f, #ff7875);
  color: white;
  padding: 8px 18px;
  border-radius: 8px;
  text-decoration: none;
}

.user-box {
  background: #fff;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
}

/* LAYOUT */
.dashboard-container {
  display: flex;
}

.sidebar {
  width: 240px;
  background: white;
  padding: 25px;
  border-right: 1px solid #eee;
  min-height: calc(100vh - 60px);
}

.sidebar h3 {
  font-size: 12px;
  color: #999;
  margin-top: 25px;
  text-transform: uppercase;
}

.sidebar a {
  display: block;
  padding: 10px 14px;
  margin: 6px 0;
  text-decoration: none;
  color: #333;
  border-radius: 10px;
}

.sidebar a.active {
  background: linear-gradient(135deg, #ff4d4f, #ff7875);
  color: white;
}

/* CONTENT */
.main-content {
  flex: 1;
  padding: 35px;
}

/* CARD */
.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 20px;
}

/* SECTION FIX */
.section {
  display: none;
}

.section.active {
  display: block;
}

/* DEFAULT SHOW */
#profileSection {
  display: block;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="dashboard-header">
  <div class="logo">QuickConvert</div>

  <div class="header-actions">
    <a href="/" class="home-btn">Home</a>
    <div class="user-box">
      👤 <span id="userEmail2"></span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="dashboard-container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>My Account</h3>
    <a href="#" onclick="showSection('profile')" id="linkProfile" class="active">Profile</a>
    <a href="#" onclick="showSection('security')" id="linkSecurity">Security</a>
    <a href="#" onclick="showSection('teams')" id="linkTeams">Teams</a>

    <h3>Settings</h3>
    <a href="#" onclick="showSection('tools')" id="linkTools">Tools</a>
    <a href="#" onclick="showSection('workflows')" id="linkWorkflows">Workflows</a>

    <h3>Billing</h3>
    <a href="#" onclick="showSection('plans')" id="linkPlans">Plans</a>
  </div>

  <!-- CONTENT -->
  <div class="main-content">

    <h2>Dashboard</h2>

    <!-- PROFILE -->
    <div id="profileSection" class="section active">
      <h1>Profile</h1>

      <div class="card">
        <h3>User Info</h3>

        <label>Full Name</label><br>
        <input type="text" id="userName" style="width:100%;padding:10px;margin:10px 0;"><br>

        <label>Email</label><br>
        <input type="text" id="userEmail" disabled style="width:100%;padding:10px;margin:10px 0;"><br>

        <button onclick="updateProfile()">Update Profile</button>

        <p id="updateMsg" style="color:green;margin-top:10px;"></p>
      </div>
    </div>

    <!-- SECURITY -->
    <div id="securitySection" class="section">
      <h1>Security</h1>

      <div class="card">
        <h3>Change Password</h3>

        <input type="password" id="currentPassword" placeholder="Current Password" style="width:100%;padding:10px;margin:10px 0;">
        <input type="password" id="newPassword" placeholder="New Password" style="width:100%;padding:10px;margin:10px 0;">

        <button onclick="changePassword()">Update Password</button>

        <p id="passwordMsg"></p>
      </div>
    </div>

    <!-- ✅ TEAMS FIXED -->
    <div id="teamsSection" class="section">
  <h1>Teams</h1>

  <div class="card">

    <input id="teamName" placeholder="Team name" />
    <button onclick="createTeam()">Create Team</button>

    <div id="teamsList"></div>

  </div>
</div>

    <!-- TOOLS -->
    <div id="toolsSection" class="section">
      <h1>Tools</h1>
      <div class="card">Tool preferences</div>
    </div>

    <!-- WORKFLOWS -->
    <div id="workflowsSection" class="section">
      <h1>Workflows</h1>
      <div class="card"><button>Create Workflow</button></div>
    </div>

    <!-- PLANS -->
    <div id="plansSection" class="section">
      <h1>Plans</h1>
      <div class="card"><button>Upgrade</button></div>
    </div>

    <!-- LOGOUT -->
    <div class="card">
      <button onclick="logout()">Logout</button>
    </div>

  </div>
</div>

<script>

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "/login";
}

async function loadUser() {
  try {
    const res = await fetch("/api/auth/me", {
      headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();

    document.getElementById("userEmail").value = data.email;
    document.getElementById("userEmail2").textContent = data.email;
    document.getElementById("userName").value = data.name || "";

  } catch {
    localStorage.removeItem("token");
    window.location.href = "/login";
  }
}
loadUser();

function showSection(section) {
  document.querySelectorAll(".section").forEach(sec => {
    sec.classList.remove("active");
  });

  document.querySelectorAll(".sidebar a").forEach(link => {
    link.classList.remove("active");
  });

  document.getElementById(section + "Section").classList.add("active");
  document.getElementById("link" + capitalize(section)).classList.add("active");
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

async function updateProfile() {
  const name = document.getElementById("userName").value;

  await fetch("/api/auth/update", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ name })
  });

  document.getElementById("updateMsg").textContent =
    "Profile updated successfully ✅";
}

async function changePassword() {
  const currentPassword = document.getElementById("currentPassword").value;
  const newPassword = document.getElementById("newPassword").value;

  const res = await fetch("/api/auth/change-password", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ currentPassword, newPassword })
  });

  const data = await res.json();

  document.getElementById("passwordMsg").textContent = data.message;
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "/";
}

function openCreateTeam() {
  alert("Create Team coming soon 🚀");
}

function viewTeam() {
  alert("Team details coming soon 🔥");
}

async function createTeam() {
  const name = document.getElementById("teamName").value;

  const res = await fetch("/api/team/create", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({ name })
  });

  const data = await res.json();

  alert("Team created ✅");

  loadTeams();
}


async function loadTeams() {
  const res = await fetch("/api/team/my", {
    headers: {
      Authorization: "Bearer " + token
    }
  });

  const teams = await res.json();

  const container = document.getElementById("teamsList");

  container.innerHTML = "";

  teams.forEach(team => {
    container.innerHTML += `
      <div style="border:1px solid #ddd;padding:10px;margin-top:10px;">
        <b>${team.name}</b><br>
        Members: ${team.members.length}

        <br><br>

        <input placeholder="Invite email" id="invite-${team._id}" />
        <button onclick="inviteMember('${team._id}')">Invite</button>
      </div>
    `;
  });
}

async function inviteMember(teamId) {
  const email = document.getElementById("invite-" + teamId).value;

  const res = await fetch("/api/team/invite", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({ teamId, email })
  });

  const data = await res.json();

  alert("Invite link generated (check console)");
}

loadTeams();
</script>

</body>
</html>
